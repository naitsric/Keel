[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
keel-core = { path = "crates/keel-core" }
keel-engine = { path = "crates/keel-engine" }
keel-harness = { path = "crates/keel-harness" }
keel-mcp = { path = "crates/keel-mcp" }
keel-store = { path = "crates/keel-store" }

axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
getrandom = "0.3"
http = "1"
libc = "0.2"
regex = "1"
rmcp = { version = "~3.5", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

# Profiles only take effect at the workspace root.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
