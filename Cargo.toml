[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
keel-core = { path = "crates/keel-core" }
keel-engine = { path = "crates/keel-engine" }
keel-harness = { path = "crates/keel-harness" }
keel-store = { path = "crates/keel-store" }

chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

# Profiles only take effect at the workspace root.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
