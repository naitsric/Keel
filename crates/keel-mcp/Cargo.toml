[package]
name = "keel-mcp"
description = "Keel's MCP server: what an assistant may see and start, served on this Mac only."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
getrandom.workspace = true
http.workspace = true
keel-core.workspace = true
keel-engine.workspace = true
keel-store.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
keel-harness.workspace = true
# An MCP client over Streamable HTTP, and plain HTTP for what no MCP client sends. No TLS and no
# system proxy: the server is on loopback.
reqwest = { version = "0.13", default-features = false }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile.workspace = true
