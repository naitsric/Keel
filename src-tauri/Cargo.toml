[package]
name = "keel"
description = "Local software factory on top of Claude Code"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix avoids a lib/bin name clash, see https://github.com/rust-lang/cargo/issues/8519
name = "keel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keel-core.workspace = true
keel-engine.workspace = true
keel-harness.workspace = true
keel-mcp.workspace = true
keel-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
